name: EICAR smoke test

on:
  push:
    branches: [main]
    paths: &eicar-paths
      - '.github/workflows/eicar-smoke.yml'
      - 'deploy/config.json'
      - 'deploy/install.sh'
      - 'deploy/install-user.sh'
      - 'deploy/install-clamav.sh'
      - 'deploy/ai-watchdog-backup-*'
      - 'deploy/ai-watchdog.service'
      - 'deploy/ai-watchdog-vulnerability-refresh.*'
      - 'deploy/ai-watchdog-userspace.*'
      - 'deploy/ai-watchdog-runtime-processes.service'
      - 'watchdog/__main__.py'
      - 'watchdog/backups.py'
      - 'watchdog/backup_crypto.py'
      - 'watchdog/backup_health.py'
      - 'watchdog/backup_verifier.py'
      - 'watchdog/backup_job.py'
      - 'watchdog/clamd_backend.py'
      - 'watchdog/notifications.py'
      - 'watchdog/common.py'
      - 'watchdog/monitor.py'
      - 'watchdog/ssh_activity.py'
      - 'watchdog/reviews.py'
      - 'watchdog/rollback.py'
      - 'watchdog/system_checks.py'
      - 'watchdog/server.py'
      - 'watchdog/store.py'
      - 'watchdog/vulnerabilities.py'
      - 'watchdog/userspace.py'
      - 'watchdog/runtime_processes.py'
      - 'watchdog/static/**'
      - 'tests/smoke/eicar_*'
      - 'tests/smoke/immutable_webdav.py'
      - 'tests/test_browser_smoke.py'
      - 'tests/test_console_integration.py'
      - 'tests/test_system_checks.py'
      - 'tests/test_rollback.py'
      - 'tests/test_backup_jobs.py'
      - 'tests/test_recurring_and_email.py'
      - 'tests/test_vulnerabilities.py'
      - 'tests/test_ssh_activity.py'
  pull_request:
    paths: *eicar-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Watchdog EICAR smoke test (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, desktop-upgrade, system-upgrade, backup-restore, system-backup-restore]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso ubuntu-keyring age rclone

      - name: Download and verify the Ubuntu cloud image
        working-directory: ${{ runner.temp }}
        run: |
          base=https://cloud-images.ubuntu.com/releases/noble/release
          for file in SHA256SUMS SHA256SUMS.gpg ubuntu-24.04-server-cloudimg-amd64.img; do
            curl --fail --silent --show-error --location --retry 2 --max-time 300 --output "$file" "$base/$file"
          done
          gpgv --keyring /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg SHA256SUMS.gpg SHA256SUMS
          awk '$2 ~ /(^|\*)ubuntu-24\.04-server-cloudimg-amd64\.img$/' SHA256SUMS | sha256sum --check -

      - name: Run the EICAR smoke test
        env:
          SMOKE_MODE: ${{ matrix.mode }}
        run: |
          if [[ -x ${GECKOWEBDRIVER:-}/geckodriver ]]; then
            export WATCHDOG_GECKODRIVER="$GECKOWEBDRIVER/geckodriver"
          fi
          bash tests/smoke/eicar_vm.sh "$RUNNER_TEMP/ubuntu-24.04-server-cloudimg-amd64.img" "$SMOKE_MODE"
